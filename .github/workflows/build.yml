name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        if: ${{ github.ref_name }} == *front*
        uses: actions/setup-node@v5
        with:
          node-version: '22.13'
      - name: Install dependencies
        if: ${{ github.ref_name }} == *front*
        run: npm ci

      - name: Build Angular project
        if: ${{ github.ref_name }} == *front*
        run: npm run build -- --configuration production

