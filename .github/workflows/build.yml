name: Build

on:
  workflow_call:
    inputs:
      build-backend:
        required: false
        type: boolean
        default: true
      build-frontend:
        required: false
        type: boolean
        default: true

jobs:
  front-build:
    if: inputs.build-frontend == true
    name: front-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ vars.FRONT_REPOSITORY }}/package-lock.json

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ${{ vars.FRONT_REPOSITORY }}/node_modules
          key: ${{ runner.os }}-node-${{ vars.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', vars.FRONT_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ vars.NODE_VERSION }}-
            ${{ runner.os }}-node-

      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ vars.FRONT_REPOSITORY }}/.angular/cache
            ${{ vars.FRONT_REPOSITORY }}/dist
          key: ${{ runner.os }}-angular-${{ hashFiles(format('{0}/src/**/*.ts', vars.FRONT_REPOSITORY)) }}-${{ hashFiles(format('{0}/angular.json', vars.FRONT_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - name: Install dependencies
        working-directory: ${{ vars.FRONT_REPOSITORY }}
        run: npm ci --prefer-offline

      - name: Build Angular project
        working-directory: ${{ vars.FRONT_REPOSITORY }}
        run: npm run build -- --configuration production
  back-build:
    if: inputs.build-backend == true
    name: back-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ vars.BACK_REPOSITORY }}/go.sum

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ vars.BACK_REPOSITORY }}/vendor
          key: ${{ runner.os }}-go-${{ vars.GO_VERSION }}-${{ hashFiles(format('{0}/go.sum', vars.BACK_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ vars.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ vars.BACK_REPOSITORY }}/tmp
          key: ${{ runner.os }}-go-build-${{ hashFiles(format('{0}/**/*.go', vars.BACK_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Ensure deps
        working-directory: ${{ vars.BACK_REPOSITORY }}
        run: go mod tidy

      - name: Build Go project
        working-directory: ${{ vars.BACK_REPOSITORY }}
        run: go build -o ${{ vars.APP_NAME }} .
