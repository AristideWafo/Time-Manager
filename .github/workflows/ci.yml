name: CI/CD Pipeline

env:
  GO_VERSION: '1.25.1'
  NODE_VERSION: '22.13'
  FRONT_REPOSITORY: './front'
  BACK_REPOSITORY: './back'
  APP_NAME: 'app'

on:
  push:
    branches: [ "feat/**", "fix/**" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "dev", "main", "feat/*", "fix/*" ]

jobs:
  build:
    name: Build Application
    uses: ./.github/workflows/build.yml
    with:
      go-version: $GO_VERSION
      node-version: $NODE_VERSION
      working-dir-front: $FRONT_REPOSITORY
      working-dir-back: $BACK_REPOSITORY
      app-name: $APP_NAME

  test:
    name: Run Tests & Linting
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      go-version: $GO_VERSION
      node-version: $NODE_VERSION
      working-dir-front: $FRONT_REPOSITORY
      working-dir-back: $BACK_REPOSITORY