name: CI for Dev Operations

env:
  GO_VERSION: "1.25.1"
  NODE_VERSION: "22.13"
  FRONT_REPOSITORY: "./front"
  BACK_REPOSITORY: "./back"
  APP_NAME: "app"

on:
  push:
    branches: ["feat/*", "fix/*","testrelease"]
  pull_request:
    types: [opened, synchronize, reopened] # Ajout de synchronize pour cache optimal
    branches: ["dev", "feat/*", "fix/*"]

jobs:
  cache-deps:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      go-cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
      npm-cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache Go dependencies
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('back/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ env.FRONT_REPOSITORY }}/node_modules
          key: ${{ runner.os }}-npm-${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ env.NODE_VERSION }}-
            ${{ runner.os }}-npm-

  build:
    name: Build
    needs: cache-deps
    uses: ./.github/workflows/build.yml
    with:
      go-version: "1.25.1"
      node-version: "22.13"
      working-dir-front: "./front"
      working-dir-back: "./back"
      app-name: "app"

  test:
    name: Tests & Linting
    needs: [cache-deps, build]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      go-version: "1.25.1"
      node-version: "22.13"
      working-dir-front: "./front"
      working-dir-back: "./back"
  package:
    name: Package Application
    needs: [build, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/packaging.yml
    with:
      node-version: "22.20"
