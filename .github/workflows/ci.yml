name: CI for Dev Operations

on:
  push:
    branches: ["feat/*", "fix/*"]
  pull_request:
    types: [opened, synchronize, reopened] # Ajout de synchronize pour cache optimal
    branches: ["dev", "feat/*", "fix/*"]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      root: ${{ steps.changes.outputs.root }}
      run-all: ${{ steps.check.outputs.run-all }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'
            root:
              - '.github/**'
              - 'nginx/**'
              - '*.json'
              - '*.yml'
              - '*.yaml'
              - '*.sh'
              - 'Dockerfile*'
              - 'docker-compose*'
              - 'sonar-project.properties'
              - 'package.json'
              - '.releaserc.json'
      - name: Check if should run all
        id: check
        run: |
          if [[ "${{ steps.changes.outputs.root }}" == "true" ]]; then
            echo "run-all=true" >> $GITHUB_OUTPUT
          else
            echo "run-all=false" >> $GITHUB_OUTPUT
          fi

  cache-deps:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.run-all == 'true'
    name: Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      go-cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
      npm-cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache Go dependencies
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ vars.GO_VERSION }}-${{ hashFiles('back/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ vars.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ vars.FRONT_REPOSITORY }}/node_modules
          key: ${{ runner.os }}-npm-${{ vars.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ vars.NODE_VERSION }}-
            ${{ runner.os }}-npm-

  build:
    name: Build
    needs: [detect-changes, cache-deps]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.run-all == 'true'
    uses: ./.github/workflows/build.yml
    with:
      go-version: ${{ vars.GO_VERSION }}
      node-version: ${{ vars.NODE_VERSION }}
      working-dir-front: ${{ vars.FRONT_REPOSITORY }}
      working-dir-back: ${{ vars.BACK_REPOSITORY }}
      app-name: ${{ vars.APP_NAME }}
      build-backend: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.run-all == 'true' }}
      build-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.run-all == 'true' }}

  test:
    name: Tests & Linting
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.run-all == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      go-version: ${{ vars.GO_VERSION }}
      node-version: ${{ vars.NODE_VERSION }}
      working-dir-front: ${{ vars.FRONT_REPOSITORY }}
      working-dir-back: ${{ vars.BACK_REPOSITORY }}
      test-backend: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.run-all == 'true' }}
      test-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.run-all == 'true' }}
