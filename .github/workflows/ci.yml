name: CI/CD Pipeline

on:
  push:
    branches: [ "feat/*","fix/*" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "dev" ]

env:
  GO_VERSION: '1.25.1'
  NODE_VERSION: '18'

jobs:
  build:
    name: Build Application
    uses: ./.github/workflows/build.yml
    with:
      environment: development

  test:
    name: Run Tests & Linting
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      environment: development