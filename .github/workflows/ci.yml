name: CI Build & Push

on:
  push:
    branches: [ "prod", "cicd" ]
  pull_request:
    branches: [ "prod", "cicd" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACK: ${{ github.repository }}/backend
  IMAGE_NAME_FRONT: ${{ github.repository }}/frontend
  IMAGE_NAME_NGINX: ${{ github.repository }}/nginx

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          echo "python-version: 3.11"
