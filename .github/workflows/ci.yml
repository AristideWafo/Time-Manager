name: CI for Dev Operations

env:
  GO_VERSION: '1.25.1'
  NODE_VERSION: '22.13'
  FRONT_REPOSITORY: './front'
  BACK_REPOSITORY: './back'
  APP_NAME: 'app'

on:
  push:
    branches: [ "feat/*", "fix/*" ]
  pull_request:
    types: [opened, reopened]
    branches: [ "dev", "feat/*", "fix/*" ]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      go-version: '1.25.1'
      node-version: '22.13'
      working-dir-front: './front'
      working-dir-back: './back'
      app-name: 'app'

  test:
    name: Tests & Linting
    needs: [build]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      go-version: '1.25.1'
      node-version: '22.13'
      working-dir-front: './front'
      working-dir-back: './back'