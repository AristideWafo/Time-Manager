name: Packaging

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACK: ${{ github.repository }}/backend
  IMAGE_NAME_FRONT: ${{ github.repository }}/frontend
  IMAGE_NAME_NGINX: ${{ github.repository }}/nginx

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        run: echo "Packaging for ${{ inputs.environment }}"

      - name: Echo based on branch
        run: |
          if [[ "${{ github.ref_name }}" == *front* ]]; then
            echo "fronts"
          elif [[ "${{ github.ref_name }}" == *back* ]]; then
            echo "backkk"
          else
            echo "no match"
          fi
