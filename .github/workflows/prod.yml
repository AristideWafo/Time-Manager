name: Production Pipeline

on:
  push:
    branches: ["prod"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["prod"]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'

  build:
    name: Build Application
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/build.yml
    with:
      build-backend: ${{ needs.detect-changes.outputs.backend == 'true' }}
      build-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' }}

  test:
    name: Run Tests & Linting
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      test-backend: ${{ needs.detect-changes.outputs.backend == 'true' }}
      test-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' }}

  security-scan:
    name: Security Analysis
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  package:
    name: Package Application
    needs: [detect-changes, build, test, security-scan]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/packaging.yml

  deploy:
    name: Deploy to Production
    needs: [package]
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
