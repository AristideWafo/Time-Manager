name: Test

on:
  workflow_call:
    inputs:
      test-backend:
        required: false
        type: boolean
        default: true
      test-frontend:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  go-lint:
    if: inputs.test-backend == true && github.event_name == 'pull_request'
    name: go-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ vars.BACK_REPOSITORY }}/go.sum

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
          key: ${{ runner.os }}-golangci-lint-${{ vars.GO_VERSION }}-${{ hashFiles(format('{0}/go.sum', vars.BACK_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-${{ vars.GO_VERSION }}-
            ${{ runner.os }}-golangci-lint-

      - name: Ensure Go dependencies
        working-directory: ${{ vars.BACK_REPOSITORY }}
        run: go mod tidy

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        working-directory: ${{ vars.BACK_REPOSITORY }}
        run: golangci-lint run --timeout=5m

  go-test:
    if: inputs.test-backend == true
    name: go-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ vars.BACK_REPOSITORY }}/go.sum

      - name: Ensure Go dependencies
        working-directory: ${{ vars.BACK_REPOSITORY }}
        run: go mod tidy

      - name: Run tests
        working-directory: ${{ vars.BACK_REPOSITORY }}
        run: go test $(go list ./... | grep -v /repository) -v -coverprofile=coverage.out

      - name: Upload test coverage
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage-report
          path: ${{ vars.BACK_REPOSITORY }}/coverage.out

  angular-lint:
    if: inputs.test-frontend == true && github.event_name == 'pull_request'
    name: angular-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ vars.FRONT_REPOSITORY }}/package-lock.json

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ${{ vars.FRONT_REPOSITORY }}/node_modules
          key: ${{ runner.os }}-node-lint-${{ vars.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', vars.FRONT_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-node-lint-${{ vars.NODE_VERSION }}-
            ${{ runner.os }}-node-lint-

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: |
            ${{ vars.FRONT_REPOSITORY }}/.eslintcache
            ${{ vars.FRONT_REPOSITORY }}/node_modules/.cache
          key: ${{ runner.os }}-eslint-${{ hashFiles(format('{0}/.eslintrc.json', vars.FRONT_REPOSITORY)) }}-${{ hashFiles(format('{0}/src/main.ts', vars.FRONT_REPOSITORY)) }}-${{ hashFiles(format('{0}/src/app/**/*.ts', vars.FRONT_REPOSITORY)) }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Install dependencies
        working-directory: ${{ vars.FRONT_REPOSITORY }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ vars.FRONT_REPOSITORY }}
        run: npm run lint:ci || true

      - name: Check for lint errors
        working-directory: ${{ vars.FRONT_REPOSITORY }}
        run: |
          ERRORS=$(jq '[.[].errorCount] | add' lint-results.json)
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS lint error(s) found"
            exit 1
          else
            echo "✅ No lint errors found"
          fi
