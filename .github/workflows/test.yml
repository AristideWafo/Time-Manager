name: Test

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Test app
        run: echo "Testing for ${{ inputs.environment }}"
  
  go-lint:
    if: contains(github.ref_name, 'cicd') || contains(github.ref_name, 'back_')
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install golangci-lint from source
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v8
          export PATH="$(go env GOPATH)/bin:$PATH"
      - name: Run golangci-lint
        run: |
          $(go env GOPATH)/bin/golangci-lint run
