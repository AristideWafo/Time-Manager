name: Test

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Test app
        run: echo "Testing for ${{ inputs.environment }}"
  
  go-lint:
    if: contains(github.ref_name, 'cicd') || contains(github.ref_name, 'back_')
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go (match go.mod)
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.2'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
