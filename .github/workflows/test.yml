name: Test

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string
      working-dir-front:
        required: true
        type: string
      working-dir-back:
        required: true
        type: string
      node-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # - name: Test app
      #   run: echo "Testing for ${{ inputs.go-version }} and ${{ inputs.node-version }}"
  
  go-lint:
    if: contains(github.ref_name, 'cicd') || contains(github.ref_name, 'back_')
    name: go-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}  # Exact version from go.mod
      
      - name: Ensure deps
        working-directory: ${{ inputs.working-dir-back }}
        run: go mod tidy

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        working-directory: ./back
        run: golangci-lint run --timeout=5m