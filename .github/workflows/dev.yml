on:
  push:
    branches: ["dev"]
  workflow_dispatch:
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'

  cache-deps:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    name: Cache Dependencies
    runs-on: ubuntu-22.04
    outputs:
      go-cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
      npm-cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache Go dependencies
        if: needs.detect-changes.outputs.backend == 'true'
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ vars.GO_VERSION }}-${{ hashFiles('back/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ vars.GO_VERSION }}-
            ${{ runner.os }}-go-

      - name: Cache npm dependencies
        if: needs.detect-changes.outputs.frontend == 'true'
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ vars.FRONT_REPOSITORY }}/node_modules
          key: ${{ runner.os }}-npm-${{ vars.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ vars.NODE_VERSION }}-
            ${{ runner.os }}-npm-

  build:
    name: Build
    needs: [detect-changes, cache-deps]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      build-backend: ${{ needs.detect-changes.outputs.backend == 'true' }}
      build-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' }}

  test:
    name: Run Tests & Linting
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      test-backend: ${{ needs.detect-changes.outputs.backend == 'true' }}
      test-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' }}

  security-scan:
    name: Security Analysis
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' && ( 
      needs.detect-changes.outputs.backend == 'true' || 
      needs.detect-changes.outputs.frontend == 'true' )
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    name: Package Application
    needs: [detect-changes, build, test, security-scan]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/packaging.yml

  deploy:
    name: Deploy to Production
    needs: [package]
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
