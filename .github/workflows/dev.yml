on:
  push:
    branches: ["dev"]
  workflow_dispatch:
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.changes.outputs.backend || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.changes.outputs.frontend || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'back/**'
            frontend:
              - 'front/**'

  build:
    name: Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      build-backend: ${{ needs.detect-changes.outputs.backend == 'true' }}
      build-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' }}

  test:
    name: Run Tests & Linting
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      test-backend: ${{ needs.detect-changes.outputs.backend == 'true' }}
      test-frontend: ${{ needs.detect-changes.outputs.frontend == 'true' }}
  
  manual-approval:
    name: Manual Approval
    runs-on: ubuntu-22.04
    needs: [test]
    steps:
      - name: Wait for approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: user1,user2

  security-scan:
    name: Security Analysis
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' || 
      needs.detect-changes.outputs.backend == 'true' || 
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-22.04
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    name: Package Application
    needs: [detect-changes, build, test, security-scan, sonarqube, manual-approval]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/packaging.yml
