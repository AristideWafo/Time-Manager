<svg
  width="220"
  height="60"
  viewBox="0 0 220 60"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Icon container -->
  <rect
    x="4"
    y="4"
    width="52"
    height="52"
    rx="12"
    fill="#0d6efd"
  />

  <!-- Clock circle -->
  <circle
    cx="30"
    cy="30"
    r="14"
    stroke="white"
    stroke-width="2.5"
    fill="none"
  />

  <!-- Clock hands -->
  <line
    x1="30"
    y1="30"
    x2="30"
    y2="20"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <line
    x1="30"
    y1="30"
    x2="38"
    y2="30"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Vertical time tracking line -->
  <line
    x1="30"
    y1="10"
    x2="30"
    y2="6"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Text -->
  <text
    x="70"
    y="36"
    fill="#0a2540"
    font-size="20"
    font-weight="600"
    font-family="Inter, Arial, sans-serif"
  >
    Time
    <tspan fill="#0d6efd">Manager</tspan>
  </text>
</svg>
