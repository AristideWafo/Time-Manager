<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle extérieur -->
  <circle cx="50" cy="50" r="45" fill="#FFD700" stroke="#DAA520" stroke-width="4" />

  <!-- Centre de l'horloge -->
  <circle cx="50" cy="50" r="5" fill="#DAA520" />

  <!-- Aiguille des heures -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="#8B8000" stroke-width="4" stroke-linecap="round" />

  <!-- Aiguille des minutes -->
  <line x1="50" y1="50" x2="70" y2="50" stroke="#8B8000" stroke-width="2" stroke-linecap="round" />
</svg>
